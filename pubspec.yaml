name: crimireview
description: CrimiReview - A Digital Quiz Application with Adaptive Learning for Criminology Students

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  fl_chart: ^0.66.0
  google_fonts: ^6.1.0
  percent_indicator: ^4.2.3
  flutter_animate: ^4.3.0
  confetti: ^0.7.0
  animations: ^2.0.8
  page_transition: ^2.1.0
  shimmer: ^3.0.0
  lottie: ^3.1.0
  cached_network_image: ^3.3.1
  image_picker: ^1.2.2
  file_picker: ^8.1.6
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  supabase_flutter: ^2.12.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  audioplayers: ^6.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#6C5CE7"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/ml/
    - assets/sounds/
    - assets/modules/
