name: crimireview
description: CrimiReview - A Digital Quiz Application with Adaptive Learning for Criminology Students

publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.2
  provider: ^6.1.1
  fl_chart: ^0.66.0
  percent_indicator: ^4.2.3
  flutter_animate: ^4.3.0
  confetti: ^0.7.0
  animations: ^2.0.8
  page_transition: ^2.1.0
  shimmer: ^3.0.0
  lottie: ^3.1.0
  cached_network_image: ^3.3.1
  image_picker: ^1.2.2
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  url_launcher: ^6.3.2
  supabase_flutter: ^2.12.4
  http: ^1.6.0
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  audioplayers: ^6.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.14.3

# App Icon Configuration
# Source: assets/icon/logo_original.png (the CrimiReview logo: white C, red
# R, cap, scales and book on black). Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  # Keeps the whole logo (book corners included) inside the circle or
  # squircle Android launchers cut the icon to.
  adaptive_icon_foreground_inset: 20
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/images/
    - assets/ml/
    - assets/sounds/
    - assets/modules/

  # Plus Jakarta Sans (SIL Open Font License, assets/fonts/OFL.txt).
  # Bundled so text renders correctly even on a first launch offline.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Italic.ttf
          style: italic
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
